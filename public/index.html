<style>
/* Light-only design (locked): calm navy on warm paper, generous spacing, one card at a time */
:root{
  color-scheme: light only;
  --paper:#f5f6f8; --card:#ffffff; --ink:#1b2430; --muted:#66717f; --line:#e3e7ec; --line-2:#cfd6de;
  --navy:#17325a; --navy-2:#24467a; --navy-soft:#e9eff7; --navy-tint:#f3f6fb;
  --gold:#b8892b; --gold-soft:#fbf3e3;
  --rose:#b3433f; --rose-soft:#fbe9e8;
  --heat1:#e7eef9; --heat2:#c9daf2; --chip:#f0f3f7;
  --body:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN',serif;
  --mono:'IBM Plex Mono','Noto Sans JP',monospace;
  --r:16px; --shadow:0 1px 2px rgba(27,36,48,.05),0 8px 24px -12px rgba(27,36,48,.18);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
header{padding:28px 0 14px;text-align:center}
.eyebrow{font-size:11.5px;letter-spacing:.18em;color:var(--gold);font-weight:700;text-transform:uppercase}
h1{font-family:var(--serif);font-size:30px;font-weight:800;margin:4px 0 6px;letter-spacing:.04em;color:var(--navy);text-wrap:balance;line-height:1.25}
.lead{font-size:13px;color:var(--muted);margin:0 auto;line-height:1.7;max-width:30em;text-wrap:balance}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 8px}
.sbox{position:relative}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:500 17px var(--body);padding:15px 16px 15px 46px;border:1.5px solid var(--line-2);border-radius:999px;background:var(--card);color:var(--ink);outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:#9aa5b2}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 4px var(--navy-soft),var(--shadow)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 6px 0;min-height:1.2em}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.item:hover,.item:focus-visible{border-color:var(--navy-2);outline:none;transform:translateY(-1px)}
.item .nm{font-weight:700;font-size:16px}
.item .gp{font-size:12px;color:var(--muted);white-space:nowrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy-2);font-weight:600}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.card-h{padding:22px 20px 16px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative}
.card-h::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.card-h .kicker{font-size:11px;letter-spacing:.16em;opacity:.75;font-weight:600}
.card-h h2{margin:2px 0 0;font-family:var(--serif);font-size:28px;font-weight:800;letter-spacing:.03em;line-height:1.25}
.card-h .gp{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--navy-tint)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:600 13px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--navy);cursor:pointer;transition:background .12s}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{padding:18px 20px 22px}
.sec h3{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.sec h3+.intro,.sec h3+.yrs{margin-top:2px}
.rule{height:2px;width:36px;background:var(--gold);border-radius:2px;margin:6px 0 12px}
.note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6;padding-top:10px;border-top:1px dashed var(--line)}
.note p{margin:0 0 4px}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--chip);border-bottom:1px solid var(--line-2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:8px}
.ucell{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;border-radius:12px;background:var(--chip);border:1px solid transparent}
.ucell.h1{background:var(--heat1);border-color:#d7e3f3} .ucell.h2{background:var(--heat2);border-color:#b7cdea}
.ucell .u{font-size:13px;font-weight:700;min-width:0;overflow-wrap:anywhere;color:var(--navy)}
.ucell .v{font-family:var(--mono);font-size:13px;white-space:nowrap}
.ucell .v b{font-weight:600;color:var(--ink)} .ucell .v span{color:var(--muted);font-size:11.5px}
.yrs{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.other{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--navy-tint);border:1px solid var(--line);font-size:13.5px;line-height:1.7}
.other b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.04em}
.shitei{font-size:14.5px;line-height:1.85}
.shitei .sl{color:#b3bcc7;padding:0 4px}
.shitei b{color:var(--navy);font-weight:700}
.clubs{display:flex;flex-wrap:wrap;gap:7px}
.club{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13.5px;background:var(--chip);border:1px solid var(--line)}
.club.s3{background:var(--navy-soft);border-color:#c9d7ea;font-weight:700;color:var(--navy)} .club .sy{font-family:var(--mono);font-size:12px}
.club.s1,.club.s0{color:var(--muted)}
.legend{font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px} .kv dd{margin:0}
.rate{display:inline-block;padding:1px 7px;border-radius:7px;font-weight:700}
.rate.r2{background:var(--gold-soft);color:#8a6414} .rate.r3{background:var(--rose-soft);color:var(--rose)}
.sen{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--card)}
.sen h4{margin:0 0 8px;font-size:15px;color:var(--navy)}
.sen h4 span{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.sen .st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sen .stage{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13.5px}
.sen .stage b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.sen .stage .row{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.sen .stage .row span:last-child{font-family:var(--mono);white-space:nowrap}
.sen .tt{font-weight:700;border-top:1px solid var(--line-2);margin-top:4px;padding-top:6px} .sen .tk{color:var(--gold);font-weight:700} .sen .ky{color:var(--navy-2);font-weight:700}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hg div{background:var(--chip);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.hg b{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.hg ol{margin:0;padding-left:22px;font-size:14.5px;line-height:1.8}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r);border:1px dashed var(--line-2)}
.foot{font-size:12px;color:var(--muted);margin:32px 6px 0;line-height:1.7;text-align:center}
.tx{font-size:13.5px}
.intro{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.warn{display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);border:1px solid #ecd9ad;color:#6d4f0f;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px;line-height:1.6}
.warn svg{flex:none;width:18px;height:18px;margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font:600 12.5px var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--navy);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.subseg{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 6px}
.subseg button{font:500 12px var(--body);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.subseg button[aria-pressed="true"]{background:var(--gold-soft);border-color:#e3c98a;color:#6d4f0f;font-weight:700}
.grp{margin-top:14px}
.grp h3{font-family:var(--serif);font-size:15px;color:var(--navy);margin:0 0 6px;padding-left:10px;border-left:3px solid var(--gold);letter-spacing:.04em}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.names button{font:500 14px var(--body);padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.names button:hover,.names button:focus-visible{border-color:var(--navy-2);outline:none}
.names button small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.back{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);color:var(--navy-2);background:none;border:none;padding:6px 0;cursor:pointer;margin-bottom:4px}
.basic{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px;margin:0}
.basic dt{color:var(--muted);font-size:12.5px;padding-top:2px} .basic dd{margin:0;overflow-wrap:anywhere}
.basic a{color:var(--navy-2);font-weight:600}
.soon{padding:14px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:13.5px;text-align:center;border:1px dashed var(--line-2)}
details summary{font-size:13px;cursor:pointer;color:var(--navy-2);font-weight:600;margin-top:10px}
@media (max-width:480px){ .sen .st,.hg{grid-template-columns:1fr} h1{font-size:26px} .card-h h2{font-size:24px} }
@media (prefers-reduced-motion:no-preference){ .card{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
<style>[hidden]{display:none!important} img{max-width:100%}</style>

科・コースでは，第1次選抜，第2選抜の段階を設け，第1次選抜で募集人員の60～80%を，第2選抜で残りの人員を選抜する。"},{"label":"学力検査","text":"学力検査の各教科の得点の合計(満点)\n5教科，各教科100点満点。傾斜配点を実施する学科・コースがある。"},{"label":"傾斜配点","text":"傾斜配点を実施する科目および満点\n傾斜配点を実施する教科の満点は150点または200点。\n国…国語　数…数学　社…社会　理…理科　英…英語"},{"label":"調査書","text":"調査書の得点(満点)\n各教科の学習の記録のうち，「評定の各学年別合計」を，各学科・コースの特色に応じて200点，300点，400点のいずれかに換算し，基本点を算出する。\n特色選抜では学科･コースの特色に応じて各学校が定めた数をかけて調査書得点の満点とする。"},{"label":"面接","text":"面接検査の実施方法および満点\n面接は，個人面接または集団面接を実施し，30点または60点を満点とする。\n特色選抜では，学科・コースの特色に応じて各学校が定めた数をかけて面接の満点とする。"},{"label":"特色検査","text":"特色検査の種別および満点\n各学科・コースの特色に応じて，特色検査として実技検査または作文(小論文)を実施する。特色検査の満点は各学校が定める。\n実…実技検査　作…作文　論…小論文"},{"label":"合計","text":"学力検査，調査書，面接，特色検査の得点の合計点"}],"sen_notes":["※2027年度入試より，選抜方法が大幅に変更されます。","※選抜基準は暫定版。県が発表する確定版を必ずご確認ください。"],"heigan_intro":"過去の入試で，公立高校を受検した生徒が，どのような私立高校を併願受験校としたかを示した表です。この表にある私立高校は，公立高校併願校として通学圏内の高校の中で，比較的受験生の多かった学校をリストアップしたもので，必ずしも合格する可能性のある高校ではありませんから注意してください。併願校を選ぶ際には，自分の実力にあったレベルの高校を選ぶ必要があります。","heigan_notes":["※岩槻高等学校は，岩槻高校・岩槻北陵高校を統合し，2026年度より開校。","※和光国際高等学校は，和光国際高校・和光高校を統合し，2026年度より開校。","※越生翔桜高等学校は，越生高校・鳩山高校を統合し，2026年度より開校。","※八潮フロンティア高等学校は，八潮南高校・八潮高校を統合し，2026年度より開校。","※秩父高等学校は，秩父高校・皆野高校を統合し，2026年度より開校。"],"kikoku_header":{"note1":"(データは2026年度のものです。2027年度の各情報についての詳細は直接各校にお問い合わせください。)","legend":"㊟推薦・一般：前期・後期などの試験をさす場合もある。特別措置など：推薦や一般の中に帰国生の枠があり，帰国生に対して得点上の配慮がある場合などをさす。入試科目：書類審査は除く。面接1：受験生のみ　面接2：グループ形式　面接3：受験生と保護者同伴　面接4：受験生と保護者別々　面接5：保護者のみ　面接6：その他　面接：形態未判明　なお，原則として面接時の保護者とは，父または母，または保証人等父母に代わる者のうちのひとり。","asof":"※2025年12月現在"},"taiiku_notes":["※2023・2024・2025年度の実績を掲載。","※判明分のみを掲載(抜粋)。学校名は実施年のもの。","※硬式野球は全国高等学校野球選手権(夏の甲子園)埼玉県予選の結果。"],"taiiku_source":"資料：埼玉県高等学校体育連盟各種目別専門部等","area_order":["さいたま市","川口市","鴻巣市","上尾市","蕨市","戸田市","桶川市","北本市","伊奈町","川越市","所沢市","飯能市","東松山市","狭山市","入間市","朝霞市","志木市","和光市","新座市","富士見市","ふじみ野市","坂戸市","鶴ヶ島市","日高市","越生町","滑川町","小川町","行田市","加須市","春日部市","羽生市","草加市","越谷市","久喜市","八潮市","三郷市","蓮田市","幸手市","吉川市","宮代町","白岡町","杉戸町","松伏町","熊谷市","本庄市","深谷市","寄居町","秩父市","小鹿野町"]},"schools":[{"name":"ふじみ野","aliases":[" <script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const S=DATA.schools, M=DATA.meta;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEC={basic:'基本情報',univ:'大学合格者数',shitei:'指定校推薦',bukatsu:'部活動',oubo:'応募状況',senbatsu:'選抜基準',heigan:'併願例',kikoku:'帰国生入試',taiiku:'部活実績'};
const ORDER=['basic','oubo','senbatsu','univ','shitei','bukatsu','heigan','taiiku','kikoku'];
const norm=s=>String(s||'').normalize('NFKC').replace(/[\s　()（）・]/g,'').replace(/ヶ/g,'ケ').replace(/ヵ/g,'カ').replace(/高等学校$|高校$/,'')
  .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
S.forEach(s=>{s._n=[s.name,...s.aliases,s.yomi||''].map(norm);});
const q=document.getElementById('q'),list=document.getElementById('list'),card=document.getElementById('card'),hint=document.getElementById('hint');
const browse=document.getElementById('browse'),seg=document.getElementById('seg'),subseg=document.getElementById('subseg'),groups=document.getElementById('groups');
const WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const H3=t=>`<h3>${t}</h3><div class="rule"></div>`;
document.getElementById('foot').innerHTML='<p>出典：2027年度入試 受験案内 付録「データ＆データ編」。数値・名称・表記は原本のとおりです。<br>空欄は原本で調査できていない項目で、0とは限りません。</p><p>'+e(M.sen_notes[1])+'</p><p>EIMEIグループ</p>';
/* ---- browse ---- */
const GROUPS=['埼玉県公立','埼玉県私立','東京都私立','神奈川県私立','千葉県私立','茨城県私立','栃木県私立','群馬県私立','国立'].filter(g=>S.some(s=>s.group===g));
const GOJU=[['あ','あいうえお'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],['た','たちつてとだぢづでど'],['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],['ま','まみむめも'],['や','やゆよ'],['ら','らりるれろ'],['わ','わをん']];
const gyo=y=>{const c=(y||'')[0]||'';const g=GOJU.find(([,cs])=>cs.includes(c));return g?g[0]:'他';};
let curG=null,curSub='all';
function drawSeg(){seg.innerHTML=GROUPS.map(g=>`<button aria-pressed="${g===curG}" data-g="${g}">${e(g)}<span style="opacity:.6;font-weight:500"> ${S.filter(s=>s.group===g).length}</span></button>`).join('');}
function drawSub(){
  const ss=S.filter(s=>s.group===curG);
  const hasArea=ss.some(s=>s.area);
  const opts=hasArea?['all','area','goju']:['all','goju'];
  const L={all:'すべて',area:'地域別',goju:'50音順'};
  subseg.innerHTML=opts.map(o=>`<button aria-pressed="${o===curSub}" data-s="${o}">${L[o]}</button>`).join('');
}
function drawGroups(){
  const ss=S.filter(s=>s.group===curG).slice().sort((a,b)=>(a.yomi||a.name).localeCompare(b.yomi||b.name,'ja'));
  let gs=[];
  if(curSub==='area'){const m={};ss.forEach(s=>{(m[s.area||'（通学区の記載なし）']=m[s.area||'（通学区の記載なし）']||[]).push(s);});
    const order=M.area_order||[...new Set(S.filter(s=>s.group===curG&&s.area).map(s=>s.area))];gs=order.map(k=>[k,m[k]]);if(m['（通学区の記載なし）'])gs.push(['（通学区の記載なし）',m['（通学区の記載なし）']]);}
  else if(curSub==='goju'){const m={};ss.forEach(s=>{const g=gyo(s.yomi);(m[g]=m[g]||[]).push(s);});gs=[...GOJU.map(x=>x[0]),'他'].filter(g=>m[g]).map(g=>[g+'行',m[g]]);}
  else gs=[[null,ss]];
  groups.innerHTML=gs.map(([t,arr])=>`<div class="grp">${t?`<h3>${e(t)}</h3>`:''}<div class="names">${arr.map(s=>`<button data-i="${S.indexOf(s)}">${e(s.name)}${curSub!=='area'&&s.area?`<small>${e(s.area)}</small>`:''}</button>`).join('')}</div></div>`).join('');
}
function drawBrowse(){if(!curG)curG=GROUPS[0];drawSeg();drawSub();drawGroups();}
seg.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;curG=b.dataset.g;curSub='all';drawBrowse();});
subseg.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;curSub=b.dataset.s;drawSub();drawGroups();});
groups.addEventListener('click',ev=>{const b=ev.target.closest('button[data-i]');if(!b)return;show(S[+b.dataset.i]);});
/* ---- search ---- */
function search(v){
  const n=norm(v); card.innerHTML='';
  if(!n){list.innerHTML='';hint.textContent=S.length+'校を収録。学校名の一部やひらがなでも探せます。下の一覧からも選べます。';browse.hidden=false;drawBrowse();return;}
  browse.hidden=true;
  let hits=S.filter(s=>s._n.some(x=>x.includes(n)));
  hits.sort((a,b)=>(a._n.some(x=>x.startsWith(n))?0:1)-(b._n.some(x=>x.startsWith(n))?0:1)||b.has.length-a.has.length||a.name.localeCompare(b.name,'ja'));
  hint.textContent=hits.length?hits.length+'校が見つかりました':'';
  if(!hits.length){list.innerHTML='<div class="empty">見つかりませんでした。別の書き方で試してください（例：「市立浦和」「大宮開成」）。</div>';return;}
  if(hits.length===1){list.innerHTML='';show(hits[0]);return;}
  list.innerHTML=hits.slice(0,40).map((s,i)=>`<button class="item" data-i="${S.indexOf(s)}"><span><span class="nm">${e(s.name)}</span><span class="badges">${s.has.map(h=>`<span class="badge">${SEC[h]}</span>`).join('')}</span></span><span class="gp">${e(s.group)}</span></button>`).join('');
}
list.addEventListener('click',ev=>{const b=ev.target.closest('.item');if(!b)return;show(S[+b.dataset.i]);});
q.addEventListener('input',()=>search(q.value));
function show(s){
  browse.hidden=true; list.innerHTML='';
  const secs=ORDER.filter(k=>k==='basic'||s.has.includes(k));
  card.innerHTML=`<button class="back" id="back">‹ 一覧にもどる</button><div class="card"><div class="card-h"><div class="kicker">SCHOOL</div><h2>${e(s.name)}</h2><div class="gp">${e(s.group)}${s.area?'　'+e(s.area):''}</div></div>
  <div class="tabs" role="tablist">${secs.map((k,i)=>`<button class="tab" role="tab" aria-selected="${i===0}" data-k="${k}">${SEC[k]}</button>`).join('')}</div>
  <div class="sec" id="sec"></div></div>`;
  document.getElementById('back').addEventListener('click',()=>{card.innerHTML='';q.value='';search('');window.scrollTo({top:0});});
  const tabs=card.querySelectorAll('.tab');
  tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.setAttribute('aria-selected',x===t));render(s,t.dataset.k);}));
  render(s,secs[0]);
  window.scrollTo({top:0});
}
const R={};
R.basic=s=>{const b=s.basic||{};const rows=[];
  const host=u=>u.replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(b.official_name)rows.push(['正式名称',e(b.official_name)]);
  rows.push(['区分',e(s.group)+(b.gender?'　'+e(b.gender):'')]);
  if(s.area)rows.push(['通学区',e(s.area)]);
  if(b.hp)rows.push(['公式サイト',`<a href="${e(b.hp)}" target="_blank" rel="noopener">${e(host(b.hp))} ↗</a>`]);
  if(b.address)rows.push(['所在地',`${e(b.address)}<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((b.official_name||s.name)+' '+b.address)}" target="_blank" rel="noopener" style="font-size:12.5px">地図で見る ↗</a>`]);
  if(b.access)rows.push(['アクセス',e(b.access)]);
  if(b.tel)rows.push(['電話',e(b.tel)]);
  if(b.courses)rows.push(['学科・コース',e(b.courses)]);
  if(b.note)rows.push(['メモ',e(b.note)]);
  const avail=s.has.map(h=>SEC[h]).join('・');
  return `${H3('基本情報')}<dl class="basic">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${b.hp?'':'<div class="soon" style="margin-top:12px">公式サイトなどの情報は、確認でき次第追加します。</div>'}<p class="intro" style="margin-top:14px">このページで見られるデータ：${e(avail)}</p>${b.hp?'<div class="note"><p>基本情報は各校の公式サイト等をもとに作成しています。最新の情報は公式サイトでご確認ください。</p></div>':''}`;};
R.univ=s=>{const u=s.univ;const cells=M.univ_cols.filter(c=>u.vals[c]).map(c=>{const v=u.vals[c];const mx=Math.max(...v.map(x=>parseInt(x)||0));const cls=mx>=50?'h2':mx>=10?'h1':'';
  return `<div class="ucell ${cls}"><span class="u">${e(c)}</span><span class="v"><b>${e(v[0]||'–')}</b> <span>${e(v[1]||'–')} / ${e(v[2]||'–')}</span></span></div>`;}).join('');
  return `${H3('大学合格者数')}<p class="yrs">各大学の数字は <b>2026年度</b> ／ 2025年度 / 2024年度（現役・浪人の合計）。「–」は原本で空欄。色付きは10人以上・50人以上。</p>
  ${cells?`<div class="grid">${cells}</div>`:'<p class="tx">58大学への合格者数は原本に記載がありません。</p>'}
  ${u.other?`<div class="other"><b>その他の大学（2025年度）</b>${e(u.other)}</div>`:''}
  <div class="note">${M.univ_notes.map(n=>`<p>${e(n)}</p>`).join('')}</div>`;};
R.shitei=s=>{const t=s.shitei.text.split('／').map(x=>{const m=x.match(/^(.+?大(?:学)?)(.*)$/);return m&&m[1].length<=12?`<b>${e(m[1])}</b>${e(m[2])}`:e(x);}).join('<span class="sl">／</span>');
  return `${H3('指定校推薦のある大学・短大')}<p class="intro">${e(M.shitei_note)}</p><div class="shitei">${t}</div><div class="note"><p>${e(M.shitei_intro.split('\n')[0])}</p></div>`;};
R.bukatsu=s=>{const b=s.bukatsu;const SY={'◎':'s3','○':'s2','△':'s1','*':'s0'};
  const cl=Object.entries(b.clubs).map(([n,v])=>`<span class="club ${SY[v]||''}"><span class="sy">${v==='*'?'＊':v}</span>${e(n)}</span>`).join('');
  return `${H3('部活動')}<p class="legend">◎ 部員31人以上　○ 10〜30人　△ 9人以下　＊ 部員数不明（活動中）</p><div class="clubs">${cl||'<span class="tx">記載なし</span>'}</div>
  ${b.other||b.note?`<div class="other"><b>その他の部活動</b>${e(b.other)}${b.note?' <span style="color:var(--navy-2)">'+e(b.note)+'</span>':''}</div>`:''}<div class="note"><p>${e(M.bukatsu_legend)}</p></div>`;};
R.oubo=s=>{const rate=v=>{const f=parseFloat(v);const c=f>=1.4?'r3':f>=1.2?'r2':'';return `<span class="rate ${c}">${e(v)}</span>`;};
  const rows=s.oubo.map(r=>`<tr><td>${e(r.course)}<span style="color:var(--muted)"> ${e(r.sex)}</span></td><td class="n">${e(r.boshu)}</td><td class="n">${e(r.kakutei)}</td><td class="n">${rate(r.shigan)}</td><td class="n">${e(r.jyuken)}</td><td class="n">${e(r.goukaku)}</td><td class="n">${rate(r.jissitsu)}</td></tr>`).join('');
  const rows2=s.oubo.map(r=>`<tr><td>${e(r.course)}</td><td class="n">${e(r.teiin)}</td><td class="n">${e(r.tenpen)}</td><td class="n">${e(r.boshu)}</td><td class="n">${e(r.henkoumae)}</td><td class="n">${e(r.kakutei)}</td></tr>`).join('');
  return `${H3('2026年度 入試応募状況')}<div class="tbl-wrap"><table><thead><tr><th>学科・コース</th><th class="n">入試募集人員</th><th class="n">確定志願者</th><th class="n">志願倍率</th><th class="n">受検者</th><th class="n">合格者</th><th class="n">実質倍率</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="legend" style="margin-top:10px">倍率の色：<span class="rate r2">1.20以上</span>　<span class="rate r3">1.40以上</span>　「—」は原本の表記のまま。</p>
  <details><summary>募集定員・転編入枠・変更前志願者数も見る</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>学科</th><th class="n">募集定員</th><th class="n">転編入枠</th><th class="n">入試募集人員</th><th class="n">変更前志願者</th><th class="n">確定志願者</th></tr></thead><tbody>${rows2}</tbody></table></div></details>`;};
R.senbatsu=s=>{const st=(x,label)=>`<div class="stage"><b>${label}（募集の${e(x.ratio)}%）</b>
  <div class="row"><span>選抜の種類</span><span class="${x.type==='特色'?'tk':'ky'}">${e(x.type)}</span></div>
  <div class="row"><span>学力検査</span><span>${e(x.gakuryoku)}${x.keisha&&x.keisha!=='—'?' <small>('+e(x.keisha)+')</small>':''}</span></div>
  <div class="row"><span>調査書</span><span>${e(x.chousa)} <small>${e(x.hiritsu)}</small></span></div>
  <div class="row"><span>面接</span><span>${e(x.mensetsu)}</span></div>
  ${x.tokushoku&&x.tokushoku!=='—'?`<div class="row"><span>特色検査</span><span>${e(x.tokushoku)}</span></div>`:''}
  <div class="row tt"><span>合計</span><span>${e(x.total)}</span></div></div>`;
  const items=s.senbatsu.map(r=>`<div class="sen"><h4>${e(r.course)}<span>${e(r.section)}・${e(r.sex)}　／　第2志望／外国人特選：${e(r.second)}</span></h4><div class="st">${st(r.s1,'第1段階')}${st(r.s2,'第2段階')}</div></div>`).join('');
  return `${H3('2027年度 選抜基準の概要')}<div class="warn">${WARN}<span>${e(M.sen_notes[1])}</span></div>${items}
  <div class="note"><p>${e(M.sen_notes[0])}</p><p>面接の「個」は個人面接、「集」は集団面接。調査書の比は1年:2年:3年。傾斜配点の教科と点は学力検査の括弧内。</p>
  ${M.sen_legend.map(l=>`<p><b>${e(l.label)}</b>　${e(l.text).replace(/\n/g,'<br>')}</p>`).join('')}</div>`;};
R.heigan=s=>{const h=s.heigan;const L=v=>typeof v==='string'?`<p class="tx" style="color:var(--muted);margin:0">${e(v)}</p>`:v.length?`<ol>${v.map(x=>`<li>${e(x)}</li>`).join('')}</ol>`:'<p class="tx" style="color:var(--muted);margin:0">記載なし</p>';
  return `${H3('私立高校の併願受験例')}<p class="intro">通学区：${e(h.area)}</p><div class="hg"><div><b>男子</b>${L(h.male)}</div><div><b>女子</b>${L(h.female)}</div></div><div class="note"><p>${e(M.heigan_intro)}</p>${M.heigan_notes.map(n=>`<p>${e(n)}</p>`).join('')}</div>`;};
R.taiiku=s=>{const rows=s.taiiku.map(r=>`<tr><td>${e(r.sport)}</td><td>${e(r.sex)}</td><td class="n">${e(r.year)}</td><td><b>${e(r.pos)}</b>${r.team!==s.name&&!s.aliases.includes(r.team)?' <small>('+e(r.team)+')</small>':''}</td></tr>`).join('');
  return `${H3('学校総合体育大会 県予選会（2023〜2025年度）')}<div class="tbl-wrap"><table><thead><tr><th>種目</th><th></th><th class="n">年度</th><th>結果</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note">${M.taiiku_notes.map(n=>`<p>${e(n)}</p>`).join('')}<p>${e(M.taiiku_source)}</p></div>`;};
R.kikoku=s=>{const k=s.kikoku;
  const rows=k.exams.map(x=>`<tr><td class="n">${e(x.date)}</td><td>${[x.kikoku?'帰国':'',x.suisen?'推薦':'',x.ippan?'一般':''].filter(Boolean).join('・')}${x.tokubetsu?'<br><small>特別措置あり</small>':''}</td><td>${e(x.subjects)}</td>${x.boshu!==undefined?`<td>${e(x.boshu)}</td>`:''}</tr>`).join('');
  const perB=k.exams.some(x=>x.boshu!==undefined);
  return `${H3('海外帰国生の受け入れ（2026年度）')}<dl class="kv"><dt>区分</dt><dd>${e(k.sex)}</dd>${perB?'':`<dt>募集人員</dt><dd>${e(k.boshu)}</dd>`}<dt>問い合わせ</dt><dd>☎ ${e(k.tel)}</dd></dl>
  <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>試験日</th><th>入試種別</th><th>入試科目</th>${perB?'<th>募集人員</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note"><p>${e(M.kikoku_header.note1)}</p><p>${e(M.kikoku_header.legend)}</p><p>${e(M.kikoku_header.asof)}</p></div>`;};
function render(s,k){document.getElementById('sec').innerHTML=R[k](s);}
search('');
const h=decodeURIComponent(location.hash.slice(1));if(h){q.value=h;search(h);}
</script>

</body>
</html>
